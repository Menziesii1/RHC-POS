services:
  kiosk-sync:
    build:
      context: .
      dockerfile: ./infra/docker/kiosk-sync.Dockerfile
    command: >
      sh -c "npm run dev --workspace @rhc-pos/kiosk-sync"
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      CORS_ORIGIN: "*"
      REMOTE_API_BASE_URL: https://rhc-posapi-production.up.railway.app/v1
      SQLITE_PATH: /data/kiosk-sync.sqlite
      SYNC_INTERVAL_MS: 15000
    ports:
      - "4100:4100"
    volumes:
      - .:/app
      - kiosk_sync_modules:/app/node_modules
      - kiosk_sync_data:/data

  kiosk:
    build:
      context: .
      dockerfile: ./infra/docker/kiosk.Dockerfile
    command: >
      sh -c "npm run build --workspace @rhc-pos/shared &&
      npm run dev --workspace @rhc-pos/kiosk -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /v1
      VITE_DEV_API_PROXY_TARGET: http://kiosk-sync:4100
      VITE_REGISTER_ID: kiosk-register-1
      VITE_ENABLE_CARD: "false"
      VITE_ENABLE_ADMIN: "false"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    ports:
      - "5173:5173"
    depends_on:
      - kiosk-sync
    volumes:
      - .:/app
      - kiosk_modules:/app/node_modules

volumes:
  kiosk_modules:
  kiosk_sync_modules:
  kiosk_sync_data:
